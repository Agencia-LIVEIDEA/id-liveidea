<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>prévia</title>
<style>
  html,body{margin:0}
  body{background:var(--surface);color:var(--ink);font-family:var(--font-sans)}

  .cap span{font-weight:400;text-transform:none}
  .wrap{padding:32px 40px;display:grid;grid-template-columns:1fr 1fr;gap:36px 32px;align-items:start}
  .tall{padding-bottom:30px}
  .amb{color:var(--ambar) !important}

  .m2 .n em{font-style:italic}
  .m2 .l{font-family:var(--font-sans);font-weight:700;font-size:12px;line-height:1.05;color:var(--ink);padding-bottom:6px}
  .right{display:flex;justify-content:flex-end}
</style></head>
<body>
<div class="wrap">
  <div><p class="cap">Logo sobre a foto <span>· logo</span></p><div id="a"></div></div>

</div>

</html>

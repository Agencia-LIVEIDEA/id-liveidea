<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>prévia</title>
<style>
  html,body{margin:0}
  body{background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
  .stage{position:relative;height:300px;background:var(--laranja);color:var(--on-laranja);display:flex;align-items:center;justify-content:center}
  #chrome{position:absolute;inset:0}
</style></head>
<body>
<div class="stage"><div id="logo"></div><div id="chrome"></div></div>
<script>
  var L = window.LiveIdea, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('logo')).render(h(L.Logo, { height: 46 }));
  ReactDOM.createRoot(document.getElementById('chrome')).render(h(L.Chrome));
</script>
</body>
</html>

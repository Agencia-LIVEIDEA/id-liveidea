<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LIVEIDEA</title>
<style>
  /* A capa da apresentação comercial (slide 1), na escala 1:2 do palco de 1920.
     Fundo laranja, logo névoa no centro, marcas de borda no meio da altura e a
     assinatura IDEIAS QUE GANHAM VIDA em âmbar a 50%, sangrando pela base. */
  html, body { margin:0; height:100%; }
  body { background:var(--laranja); overflow:hidden; }
  .cover { position:relative; width:960px; height:360px; overflow:hidden; background:var(--laranja); }
  .logo { position:absolute; left:433.5px; top:166px; width:93.2px; height:auto; display:block; }
  .chrome { position:absolute; top:172px; font-family:var(--font-grotesk); font-weight:700; font-size:6px; line-height:1.4; color:var(--on-laranja); white-space:nowrap; }
  .chrome.l { left:13.5px; }
  .chrome.r { right:13px; }
  .sign { position:absolute; left:-6.5px; top:277px; margin:0; white-space:nowrap;
          font-family:var(--font-display); font-size:153.6px; line-height:.74; letter-spacing:-.02em;
          text-transform:uppercase; color:var(--ambar); opacity:var(--opacity-watermark); font-weight:400; }
  .sign b { font-weight:700; }
  .sign em { font-weight:300; font-style:italic; }
</style>
</head>
<body>
<div class="cover">
  <img class="logo" src="/_blob/a2ab74bdcfd7edb966730717755b3910" alt="LIVEIDEA">
  <span class="chrome l">LIVEIDEA AG</span>
  <span class="chrome r">2027©</span>
  <p class="sign" aria-hidden="true"><b>IDEIAS </b><em>QUE</em> GANHAM <b>VIDA</b></p>
</div>
</body>
</html>
